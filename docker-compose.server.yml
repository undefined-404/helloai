# ============================================================
# HelloAI - Server Deployment Docker Compose (middleware + app)
# Deploy path: /home/admin/helloai/docker-compose.yml
# Prerequisite: helloai-start-1.0.0-SNAPSHOT.jar in same directory
# Usage: docker compose up -d
# ------------------------------------------------------------
# Differences from local dev version:
#   1. Added app service running jar directly with eclipse-temurin:17-jre
#   2. App connects to middleware via compose internal network (service names),
#      overridden by SPRING_* env vars, no jar repackaging needed
#   3. Middleware ports bound to all interfaces (incl. public IP) for remote IDE debugging;
#      MUST whitelist 15432/26379/25672/25673 in Alibaba Cloud security group to your IP
#   4. Added web service (nginx): serves frontend dist + proxies /api, /mcp to app,
#      only port 80 exposed publicly; 6565 bound to 127.0.0.1 for local troubleshooting
# Prerequisite files (same dir as this file, relative paths preserved):
#   helloai-start-1.0.0-SNAPSHOT.jar   # app 镜像内运行的 jar
#   dist/                              # 前端静态文件（web 服务挂载）
#   nginx.conf                         # web 服务反向代理配置
#   deploy/middleware/rabbitmq/init.sh # rabbitmq-init 容器执行的初始化脚本
#     ⚠️ 必须连同目录结构 deploy/middleware/rabbitmq/ 一起存在：
#        缺此文件时 rabbitmq-init 会「假成功」（详见 rabbitmq-init 服务注释里的 fail-open 说明），
#        结果是 app 照常启动但 vhost /helloai 从未创建 —— 即本次线上事故的静默形态。
# ============================================================

services:

  # --- PostgreSQL 16.4 ---
  postgres:
    image: postgres:16.4-alpine
    container_name: helloai-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: helloai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helloai"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Redis 7.2.5 ---
  redis:
    image: redis:7.2.5-alpine
    container_name: helloai-redis
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RabbitMQ 3.12.14 (with management plugin) ---
  rabbitmq:
    image: rabbitmq:3.12.14-management-alpine
    container_name: helloai-rabbitmq
    restart: unless-stopped
    ports:
      - "25672:5672"    # AMQP
      - "25673:15672"   # Management UI
    environment:
      # 管理员账号改为可覆盖，默认值保持 guest 以不改变现有行为。
      # 注意：default_user/default_pass 只在节点【首次启动】时创建；
      #       已有 volume 数据的节点改这两个变量【完全无效】，
      #       必须用 rabbitmqctl add_user 一次性手工建管理员（见 deploy 文档）。
      # RabbitMQ 官方限制：guest 仅允许回环登录（与协议无关），
      #       故 rabbitmq-init 这类兄弟容器【不能】用 guest，须用非 guest 专用管理员。
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:-guest}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- RabbitMQ 隔离初始化（一次性容器，幂等，可反复重跑）---
  # 职责：创建 vhost /helloai + 业务用户 helloai + 授权（脚本复用 deploy/middleware/rabbitmq/init.sh）。
  # 缺失本服务 = 本轮线上故障的制度性根因（vhost /helloai 从未被创建，MQ 静默不可用）。
  # 管理员必须是非 guest 账号：guest 仅限回环登录，兄弟容器（非回环）用它会 403/ACCESS_REFUSED。
  #
  # ⚠️ fail-open 防护（两处都必须保留；已实测，勿凭直觉简化）：
  #   源文件缺失时，Docker 会在宿主机【创建同名空目录】而不是报错 —— 短语法与
  #   长语法 bind 都是如此（实测 docker compose 29.2.1 / compose v5.1.0：两种写法
  #   均 up 成功且都建出空目录，均未报错）。随后 `/bin/sh /init/init.sh` 变成
  #   `/bin/sh <一个空目录>` —— 实测返回 **rc=0 且零输出**，于是 compose 判 init「成功」，
  #   app 照常被拉起，而 vhost/用户/权限一条都没建 = 与本次事故完全同构的静默 MQ 故障。
  #   保险一：长语法 bind（语义更明确；但它【并不】阻止空目录，不能单独依赖）。
  #   保险二：显式 test -f 守卫 —— 这才是真正兜住 fail-open 的那一道：
  #           实测挂了空目录时守卫使容器 ExitCode=1，进而 app 被
  #           service_completed_successfully 拦住（app 停在 created、日志为空），
  #           且 `docker compose up -d` 返回非 0。
  rabbitmq-init:
    image: curlimages/curl:latest
    container_name: helloai-rabbitmq-init
    restart: "no"
    # 守卫：/init/init.sh 必须是【存在的普通文件】，否则明确报错并非 0 退出。
    # 用 exec 替换 shell 进程，保证脚本的退出码被 compose 如实看到。
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -f /init/init.sh || { echo '[rabbitmq-init] 错误：/init/init.sh 不存在（bind mount 源文件缺失，或 Docker 因源缺失建成了空目录）。请确认部署目录含 deploy/middleware/rabbitmq/init.sh。' >&2; exit 1; }; exec /bin/sh /init/init.sh"]
    volumes:
      - type: bind
        source: ./deploy/middleware/rabbitmq/init.sh
        target: /init/init.sh
        read_only: true
    environment:
      # 刻意使用 `:-` 空默认：无 .env 时 compose 渲染不产生 "variable is not set" 告警；
      # 值为空则由 init.sh 顶部的守卫【明确报中文错误并非 0 退出】（绝不静默继续）。
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:-}
      HELLOAI_RABBIT_USER: ${HELLOAI_RABBIT_USER:-helloai}
      HELLOAI_RABBIT_PASSWORD: ${HELLOAI_RABBIT_PASSWORD:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- MinIO Object Storage ---
  minio:
    image: minio/minio:latest
    container_name: helloai-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:29000:9000"   # S3 API
      - "127.0.0.1:29001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- HelloAI Application (jar, no image build needed) ---
  app:
    image: eclipse-temurin:17-jre
    container_name: helloai-app
    restart: unless-stopped
    working_dir: /app
    # To update jar: replace jar file then run docker compose restart app
    volumes:
      - ./helloai-start-1.0.0-SNAPSHOT.jar:/app/helloai-start.jar:ro
      - ./logs:/app/logs              # persistent logs on host
    command: java -Xms512m -Xmx2g -jar helloai-start.jar
    ports:
      - "127.0.0.1:6565:6565"   # localhost only; public traffic goes through web(nginx):80
    environment:
      TZ: Asia/Shanghai
      # Activate dev profile, using Docker internal network config from application-dev.yml
      SPRING_PROFILES_ACTIVE: dev
      # SPRING_* env vars below override application-dev.yml fields,
      # ensuring compose internal network (service-name:container-port) without repackaging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/helloai?currentSchema=public&reWriteBatchedInserts=true
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # RabbitMQ 收敛为【单一机制】：统一走 application-dev.yml 的 RABBITMQ_* 占位符，
      # 不再混用 SPRING_RABBITMQ_*（后者无 username/virtual-host 对应项，会让 user/vhost 失控）。
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${HELLOAI_RABBIT_USER:-helloai}
      # vhost 固定为 /helloai（不作变量化）：
      #   init.sh 也硬编码创建此 vhost（Management API 里须 URL 编码为 %2Fhelloai）。
      #   二者必须一致，故此处不暴露为可配置项 —— 否则改 .env 会让 app 与 init.sh 分叉，
      #   表现为「app 连得上 broker 但 vhost 不存在」的静默故障。
      RABBITMQ_VHOST: /helloai
      # 密码与 rabbitmq-init 建用户时【同源】：都取 .env 的 HELLOAI_RABBIT_PASSWORD。
      #   只保留这一个变量名，避免出现「init.sh 用新密码建用户、app 却用另一个密码去连」的分叉
      #   （那正是本次事故的重演路径）。
      # 用 `:?` 做 fail-fast：缺 .env 时 compose 立即报错并指明缺哪个变量，
      #   而不是静默注入空串——空串会被 Spring 当作「已设置」，覆盖掉 application-dev.yml 的
      #   默认密码，把服务从「能跑」打成「跑不了」。
      # 取舍：这会让「无 .env 时 docker compose config 由通过变为失败」。这是期望行为，
      #   符合项目 §41/42「fail-fast when missing」口径：明确失败优于静默半可用。
      RABBITMQ_PASSWORD: ${HELLOAI_RABBIT_PASSWORD:?部署目录 .env 必须提供 HELLOAI_RABBIT_PASSWORD，且该值必须与 rabbitmq-init 建用户时用的值一致（同一个变量，勿分叉）}
      # MinIO 走 compose 内网（app 容器内 localhost 是自身，默认值 localhost:29000 不可达），
      # 不配置则平台物化/附件直读全部失败（核验报“附件内容不可读”）
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: helloai-artifacts
      # 凭据加密密钥入口：application.yml 默认值已随开源仓库随机化，
      # 生产必须在部署目录 .env 写入 HELLOAI_CREDENTIAL_AES_KEY_BASE64=<原密钥>（.env 已被 .gitignore 排除）
      HELLOAI_CREDENTIAL_AES_KEY_BASE64: ${HELLOAI_CREDENTIAL_AES_KEY_BASE64:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # 等 rabbitmq-init 成功退出后再启动 app。原因：首次 up -d 时 app 与 init 并发，
      # app 会因为 vhost/用户尚未建好而认证失败，进入重连窗口；该窗口内
      # outbox 投递 / 执行指令消费 / 审查 三条 MQ 链路都不可用。
      # 取舍：这会让「init 失败 ⇒ app 不启动」。这是期望行为——
      #       宁可明确失败并暴露问题，也不要静默地半可用。
      rabbitmq-init:
        condition: service_completed_successfully

  # --- Nginx: frontend static hosting + API reverse proxy (only public entry) ---
  web:
    image: nginx:1.27-alpine
    container_name: helloai-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
