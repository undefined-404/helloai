# ============================================================
# HelloAI - 服务器 nginx 配置（容器内挂载为 /etc/nginx/conf.d/default.conf）
# 职责: 托管前端 dist 静态文件 + 反向代理 /api、/mcp 到 app:6565
# 部署位置: /home/admin/helloai/nginx.conf
# 等保三级（传输保密性/完整性）：HTTPS 443 + TLS1.2/1.3（证书就绪后启用下方 443 server）
# 乱码防护：charset utf-8 统一前后端文本编码（外部 AI 拉取任务内容全链路 UTF-8）
# ============================================================

server {
    listen 80;
    server_name _;

    # 全链路 UTF-8：HTTP 响应头统一携带 charset，防外部 AI/CLI 按 GBK 误读中文任务内容
    charset utf-8;

    # 前端静态文件（compose 挂载 ./dist 到此目录）
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反向代理（前端 axios baseURL=/api，后端接口自带 /api 前缀，无需 rewrite）
    location /api/ {
        proxy_pass http://app:6565;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 对话/执行类接口可能等待 LLM 响应（后端 sync-timeout 180s），放宽读超时
        proxy_read_timeout 300s;
    }

    # MCP SSE 长连接（外部 Agent 经 80 端口接入时使用；SSE 必须关闭缓冲）
    location /mcp/ {
        proxy_pass http://app:6565;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 路由为 hash 模式，静态文件直接返回即可；index.html 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
# HTTPS 443（等保三级：通信传输保密性）
# 启用步骤：
#   1. 申请证书（阿里云免费证书 / acme.sh）放入 /home/admin/helloai/certs/
#   2. docker-compose.server.yml 的 web 服务 volumes 追加 ./certs:/etc/nginx/certs
#   3. 将下方 listen 80 的 server 块整体替换启用的 443 server，重启 web 容器
# 说明：TLS 终结在 nginx（app 容器内部仍 http://app:6565，标准反代模式）；
