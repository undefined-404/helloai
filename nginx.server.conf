# ============================================================
# HelloAI - 服务器 nginx 配置（容器内挂载为 /etc/nginx/conf.d/default.conf）
# 职责: 托管前端 dist 静态文件 + 反向代理 /api、/mcp 到 app:6565
# 部署位置: /home/admin/helloai/nginx.conf
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端静态文件（compose 挂载 ./dist 到此目录）
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反向代理（前端 axios baseURL=/api，后端接口自带 /api 前缀，无需 rewrite）
    location /api/ {
        proxy_pass http://app:6565;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 对话/执行类接口可能等待 LLM 响应（后端 sync-timeout 180s），放宽读超时
        proxy_read_timeout 300s;
    }

    # MCP SSE 长连接（外部 Agent 经 80 端口接入时使用；SSE 必须关闭缓冲）
    location /mcp/ {
        proxy_pass http://app:6565;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 路由为 hash 模式，静态文件直接返回即可；index.html 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
