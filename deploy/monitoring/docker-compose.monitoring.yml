# ============================================================
# HelloAI - Prometheus + Grafana monitoring stack (phase 1: metrics)
# Reference: maticube deploy/monitoring (verified implementation)
# ------------------------------------------------------------
# Prerequisite: main stack is up (docker-compose.yml locally or
#               docker-compose.server.yml on server), external
#               network helloai_default already exists.
#
# Start (local default, scrapes host.docker.internal:6565):
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Start (server, scrapes compose-internal app:6565):
#   export PROMETHEUS_CONFIG=./prometheus/prometheus.yml
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Stop: docker compose -f deploy/monitoring/docker-compose.monitoring.yml down
#
# Ports are bound to 127.0.0.1 only (no public exposure):
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000 (admin/admin)
#
# PostgreSQL monitoring account (run manually once, see README.md):
#   CREATE ROLE helloai_monitor LOGIN PASSWORD 'HelloAI_monitor_2026';
#   GRANT CONNECT ON DATABASE helloai TO helloai_monitor;
#   GRANT pg_monitor TO helloai_monitor;
#
# RabbitMQ needs no extra exporter: the management image enables the
# rabbitmq_prometheus plugin by default (port 15692)
# ============================================================

# Explicit project name: avoids sharing the default project name "monitoring"
# with the maticube monitoring compose (same directory name), which would let
# down/up commands affect each other's containers and volumes.
name: helloai-monitoring

services:

  # --- Prometheus (scrapes app / rabbitmq / redis / postgres) ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: helloai-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus-local.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - helloai-net

  # --- Grafana (provisioning auto-loads datasource and dashboard) ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: helloai-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - helloai-net

  # --- Redis Exporter ---
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: helloai-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks:
      - helloai-net

  # --- PostgreSQL Exporter ---
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: helloai-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://helloai_monitor:HelloAI_monitor_2026@postgres:5432/helloai?sslmode=disable"
    networks:
      - helloai-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  helloai-net:
    external: true
    name: helloai_default
