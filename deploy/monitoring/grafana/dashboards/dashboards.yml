# Grafana dashboard provisioning (auto-loaded at startup)
apiVersion: 1
providers:
  - name: "helloai"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
