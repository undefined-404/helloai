# ============================================================
# Prometheus config - HelloAI server environment (docker-compose.server.yml)
# ------------------------------------------------------------
# Use on the server (PROMETHEUS_CONFIG=./prometheus/prometheus.yml).
# All targets are reached via compose-internal service names:
#   app        -> app:6565   (/actuator/prometheus)
#   RabbitMQ   -> rabbitmq:15692 (built-in prometheus plugin in management image)
#   Redis      -> redis-exporter:9121
#   PostgreSQL -> postgres-exporter:9187
# ============================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    application: helloai
    environment: server

scrape_configs:
  # ========== HelloAI application (Actuator Prometheus endpoint) ==========
  - job_name: "helloai-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "app:6565"
        labels:
          app: helloai
          env: server

  # ========== RabbitMQ (built-in prometheus plugin, port 15692) ==========
  - job_name: "rabbitmq"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "rabbitmq:15692"
        labels:
          app: rabbitmq
          env: server

  # ========== Redis ==========
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          app: redis
          env: server

  # ========== PostgreSQL ==========
  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          app: postgresql
          env: server

  # ========== Prometheus self-monitoring ==========
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "localhost:9090"
