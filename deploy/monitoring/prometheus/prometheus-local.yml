# ============================================================
# Prometheus 配置 — HelloAI 本地开发环境（IDEA 启动 app）
# ------------------------------------------------------------
# 本地默认使用（docker-compose.monitoring.yml 默认挂载本文件）。
# app 在宿主机 IDEA 运行，通过 host.docker.internal:6565 抓取；
# 中间件为 compose 容器，通过服务名访问。
# ============================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    application: helloai
    environment: local

scrape_configs:
  # ========== HelloAI 应用（宿主机 IDEA 运行，Actuator Prometheus 端点） ==========
  - job_name: "helloai-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "host.docker.internal:6565"
        labels:
          app: helloai
          env: local

  # ========== RabbitMQ（内置 prometheus 插件，15692） ==========
  - job_name: "rabbitmq"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "rabbitmq:15692"
        labels:
          app: rabbitmq
          env: local

  # ========== Redis ==========
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          app: redis
          env: local

  # ========== PostgreSQL ==========
  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          app: postgresql
          env: local

  # ========== Prometheus 自身监控 ==========
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "localhost:9090"
