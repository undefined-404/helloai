# ============================================================
# Prometheus config - HelloAI local dev environment (app runs in IDEA)
# ------------------------------------------------------------
# Local default (docker-compose.monitoring.yml mounts this file).
# The app runs on the host via IDEA and is scraped through
# host.docker.internal:6565; middleware containers are reached
# by service names.
# ============================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    application: helloai
    environment: local

scrape_configs:
  # ========== HelloAI application (host IDEA, Actuator Prometheus endpoint) ==========
  - job_name: "helloai-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "host.docker.internal:6565"
        labels:
          app: helloai
          env: local

  # ========== RabbitMQ (built-in prometheus plugin, port 15692) ==========
  - job_name: "rabbitmq"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "rabbitmq:15692"
        labels:
          app: rabbitmq
          env: local

  # ========== Redis ==========
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          app: redis
          env: local

  # ========== PostgreSQL ==========
  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          app: postgresql
          env: local

  # ========== Prometheus self-monitoring ==========
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "localhost:9090"
