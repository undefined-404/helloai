# RabbitMQ configuration (3.12+ classic config file)
# Replaces the deprecated RABBITMQ_VM_MEMORY_HIGH_WATERMARK env var,
# which is treated as a hard error by rabbitmq:3.12 and blocks startup.
#
# Memory high watermark: align the server's cgroup limit. On a 4C4G server
# with mem_limit 512m the container reports ~512MB; 0.5 keeps flowsafe
# headroom and prevents OOM kills of the app during bursts.
vm_memory_high_watermark.relative = 0.5