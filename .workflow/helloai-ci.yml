# ============================================================================
# HelloAI CI —— Gitee Go 流水线（自有主机版）
#
# 【为什么从「云端构建机」改成「自有主机」】
#   官方计费规则（help.gitee.com/enterprise/pipeline/billing）：
#     「仅当您使用 Gitee 提供的云端构建资源，且流水线中的任务属于计费模型时，
#       任务运行才会消耗核分。」计费公式 = 运行分钟 × CPU 核数。
#   免费额度：每月 1000 核分（折合 2C4G 跑 500 分钟，月末清零）+ 单仓库 200 分钟永久。
#   本项目全量门禁（1686 用例 + 前端 npm ci && build）单次约 15~30 分钟，
#   走云端会持续吃掉额度；改用 `shell@agent` 在**自有主机组**执行则**不消耗核分**。
#
# 【代价】云端插件那层「CentOS 8.3 基础镜像 + 阿里源」没有了，环境须自备。
#   主机侧一次性准备与自检：bash scripts/ci/host-prepare.sh
#   安装缺失项（需 root）：  sudo bash scripts/ci/host-prepare.sh --install
#   4G 内存机器建议加 swap：  sudo bash scripts/ci/host-prepare.sh --swap 2G
#
# 【hostGroupID 来源】Gitee → 主机组管理 → 本仓库关联的主机组「主机组标识」。
#   当前值 lhns-ohe6q092 对应主机组：Ubuntu24.04-Docker29.7l4x
#   （类型「腾讯云导入」，操作系统 Linux，仓库作用域 undefined_404/helloai）
#
# 【本配置要生效，还需在 Gitee 侧做两件事（配置文件本身做不到）】
#   1) 在可视化编辑器中打开本 shell@agent 任务的「是否克隆代码」开关
#      —— 官方 yml 未公布该开关的字段名，因此只能由可视化编辑器写入；
#         缺了它，任务启动时主机上没有仓库，脚本会以 [FAIL] 明确退出（不会假绿）。
#      前置：该主机的 SSH 公钥需已添加到 Gitee（仓库部署公钥 或个人公钥），
#            否则平台克隆会因权限不足失败。
#      （备选：本仓库是**公开仓库**，HTTPS 匿名可读 —— 若只保留 push: master 触发，
#        也可在任务里改用 `git clone https://gitee.com/undefined_404/helloai.git` 自行克隆。
#        但因 PR 构建需要 PR 源分支的 ref，自行克隆无法覆盖 PR 场景，故不采用。）
#   2) 仓库设置 → 分支保护 → master：勾选「通过 CI 检查才允许合并」，
#      门禁才成为不可绕过的前置。
#
# 【想退回云端构建（方案 A）】
#   git show b02dce3:.workflow/helloai-ci.yml > .workflow/helloai-ci.yml
#
# 【门禁逻辑在哪】本文件只是薄封装，真正逻辑全在 scripts/ci/ci-gate.sh
#   （JDK 固定 → 构建+真实单测 -DskipTests=false → 断言用例数>0 → 架构冻结 → 前端）。
#   本地同一脚本可复现，因此平台 YAML 字段若有差异，门禁语义不会丢失。
#
# 【脚本内禁用语法（重要）】Gitee 会把「美元符号 + 花括号」的形式当作流水线参数引用并做
#   文本替换，未被定义的参数可能被替换成空值。因此 shell 脚本体内**一律不写该形式**：
#     - 不用「变量 + 冒号减号 + 默认值」的展开写法，改用普通赋值；
#     - 不用花括号包裹变量名，统一写 $VAR；
#     - 命令替换 $(...) 不受影响，可正常使用。
# ============================================================================

version: '1.0'
name: helloai-ci
displayName: HelloAI CI

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

stages:
  - stage:
      name: gate
      displayName: 构建 · 单测 · 架构冻结（自有主机）
      strategy: fast
      trigger: auto
      steps:
        - step: shell@agent
          name: full_gate
          displayName: 门禁（自有主机执行）
          # 目标主机组标识（见文件头说明）
          hostGroupID: lhns-ohe6q092
          script: |
            set -uo pipefail

            # ---- 环境约束：4 核 4G 自有主机（且同机常驻中间件！）----
            # 实测该主机常驻 docker 中间件（PG/MySQL/Redis/RabbitMQ/MinIO）：
            #   mem_limit 合计 2944MB，典型占用 1.6~2.0GB。留给 CI 的实际可用内存
            #   不足 1.5GB，因此这里把堆上限压到 1024m（原 1536m 会与中间件抢内存）。
            # 另注：surefire 分叉出的测试 JVM 不吃 MAVEN_OPTS，其默认堆为物理内存的 1/4，
            #   即约 1GB —— 合计峰值仍需 swap 兜底，请先执行：
            #       sudo bash scripts/ci/host-prepare.sh --swap 2G
            # 注：脚本内刻意不使用「变量带默认值展开」的语法（见文件头「脚本内禁用语法」），
            #     一律用普通赋值，避免 Gitee 的参数替换介入。
            MAVEN_OPTS="-Xmx1024m -XX:+UseSerialGC"
            NODE_OPTIONS="--max-old-space-size=1024"
            export MAVEN_OPTS NODE_OPTIONS
            # 让前端门禁走 npm ci（按 lock 文件装依赖，可复现）
            export HELLOAI_CI=1

            echo "===== 1/3 环境自检 ====="
            echo "host=$(hostname)  cpu=$(nproc)  mem=$(free -h | awk '/^Mem:/{print $2}')  swap=$(free -h | awk '/^Swap:/{print $2}')"
            for c in bash git java mvn node npm; do
              printf '%-6s -> %s\n' "$c" "$(command -v $c || echo '缺失')"
            done
            java -version 2>&1 | head -2

            echo "===== 2/3 定位仓库副本 ====="
            if [ -f "$PWD/scripts/ci/ci-gate.sh" ]; then
              REPO="$PWD"
            else
              GATE=$(find "$HOME" /home /root -maxdepth 6 -type f -path '*/scripts/ci/ci-gate.sh' 2>/dev/null | head -1)
              if [ -z "$GATE" ]; then
                echo "[FAIL] 主机上未找到已克隆的仓库副本。"
                echo "       请在本任务的可视化编辑中打开「是否克隆代码」开关；"
                echo "       前置：本机 SSH 公钥已添加到 Gitee（仓库部署公钥或个人公钥）。"
                exit 2
              fi
              REPO=$(cd "$(dirname "$GATE")/../.." && pwd)
            fi
            cd "$REPO" || exit 1
            echo "repo=$REPO"
            echo "branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)  commit=$(git rev-parse --short HEAD 2>/dev/null)"
            git log -1 --pretty='  最近提交: %h %ad %an %s' --date=short 2>/dev/null

            echo "===== 3/3 执行门禁 scripts/ci/ci-gate.sh ====="
            exec bash scripts/ci/ci-gate.sh
