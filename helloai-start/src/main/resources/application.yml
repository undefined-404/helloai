server:
  port: 6565

spring:
  application:
    name: helloai
  # === MCP Server（v2.4 §3.1 / §9 spring-ai 路线 C） ===
  # spring-ai 1.0 GA 默认 sse-endpoint=/sse（短路径），与 v2.4 文档约定的 /mcp/sse 路径不一致
  # 显式覆盖到 v2.4 路径，确保 Qoder/Trae 按文档配置可直连
  ai:
    mcp:
      server:
        name: helloai-mcp-server
        version: 1.0.0
        sse-endpoint: /mcp/sse         # v2.4 §9.3 验收：对齐文档路径
        sse-message-endpoint: /mcp/messages  # 标准 message endpoint（v2.4 协议约定）
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-a36fdda1d4ad4e0386e78fc435be0d16}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        completions-path: ${DEEPSEEK_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
      http:
        connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:60000}
  datasource:
    url: jdbc:postgresql://localhost:15432/helloai?currentSchema=public&reWriteBatchedInserts=true
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 26379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
  rabbitmq:
    host: localhost
    port: 25672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 容忍历史迁移脚本不在 classpath（V2-V10 在历史会话中已应用但脚本文件未保留）
    validate-on-migrate: false
    ignore-missing-migrations: true

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
  # 自定义 XML mapper 路径（覆盖 BaseMapper.insert 默认行为，例如 JSONB 列）
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

moss:
  thread:
    pool:
      core-size: 8
      max-size: 64
      queue-capacity: 1000
      keep-alive-seconds: 60


# === Agent 自注册配置 ===
helloai:
  agent:
    registration-token: "helloai-reg-2024"
    allow-registration: true
  # Phase 2B 调度策略 3：外部优先 / 空闲优先 / 平台内 LLM 保底
  dispatch:
    auto-assign-on-create: false
    prefer-external: false
    require-idle: true
    # Phase 2C N11：外部 Agent 连续失败阈值后自动回退到平台内 API_KEY_LLM
    fallback:
      enabled: true
      failure-threshold: 3
      cooldown-minutes: 10
      scan-interval-ms: 60000
  execution:
    enabled: true
    mock-mode: false
    require-vault: true
    provider: deepseek
    model: deepseek-chat
    mock-response-prefix: "[mock-executor]"
    sync-timeout-seconds: 180
    # Phase 2A §5.1/§5.2: DB Poller 主消费；EVENT 模式下退化为孤儿 PENDING 兜底扫描
    poller-enabled: true
    poller-interval-ms: 1000
    poller-orphan-threshold-seconds: 60
    poller-batch-size: 20
    # Phase 2A §5.2: DB Poller 主线化
    # consumer-mode 决定主消费从哪条路径走：
    #   EVENT: 事务事件为主，Poller 仅扫孤儿（兼容模式）
    #   POLLER: 不发布事务事件，Poller 扫所有 PENDING 作为主路径（默认）
    #   BOTH: 事件与 Poller 并行，CAS 保证幂等，适合 EVENT→POLLER 过渡
    consumer-mode: POLLER
  # N9: 多Provider统一配置入口，替代各factory中散落的@Value
  providers:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      default-model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
      connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:60000}
  security:
    credential:
      aes-key-base64: ${HELLOAI_CREDENTIAL_AES_KEY_BASE64:MEsmol1MWDTT69/lAOGeYGmDa9/a6S/lfHdfmekX0MM=}
  alert:
    # 钉钉机器人 Webhook（v2.4 §4.8）。留空则不发送
    dingtalk-webhook-url: ""
    # 飞书机器人 Webhook（v2.4 §4.8）。留空则不发送
    feishu-webhook-url: ""


score:
  time-weight: 0.25
  quality-weight: 0.30
  coop-weight: 0.25
  stability-weight: 0.15
  efficiency-weight: 0.05

logging:
  level:
    com.helloai: INFO
    com.helloai.core: DEBUG
    com.helloai.job: INFO

# === Resilience4j 熔断降级（v2.4 §4.5） ===
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.helloai.common.base.BizException
          - java.lang.RuntimeException
        ignore-exceptions:
          - com.helloai.common.base.AgentUnavailableException
    instances:
      agentDispatch:
        base-config: default

# === Actuator 指标暴露（v2.4 §4.8） ===
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  metrics:
    export:
      simple:
        enabled: true
  endpoint:
    health:
      show-details: always

# === CGLIB 缓存策略（v2.4 §3.1 M4 配套，避开 spring-boot CGLIB cache 损坏） ===
# 默认 false，由 HelloAIApplication.main() 读取后 System.setProperty 注入到 JVM。
# 说明：
#   - spring-ai 1.x + spring-boot 3.4 + McpAuthFilterConfig CGLIB 增强，
#     在 spring-boot 进程异常退出（kill -9 / OOM / 断电）后偶发导致
#     下次启动报 "Unable to load cache item"。
#   - 设 false 后：每次启动重新生成 CGLIB 代理类，多花 ~2 秒，但绝对稳定。
#   - 设 true 后：启动更快，但需要保证 spring-boot 进程正常退出
#     或者在重启前清 %TEMP%\cglib* 目录，否则会复现 cache 损坏。
# 切换方法（无需改代码）：
#   - 命令行：java -Dcglib.cache.classes=true -jar helloai-start.jar
#   - Docker ENV：JAVA_TOOL_OPTIONS=-Dcglib.cache.classes=true
#   - IDEA Run Configuration VM options：-Dcglib.cache.classes=true（仅开发期）
# 详细参见项目 memory "Spring Boot CGLIB 缓存污染诊断与修复"。
cglib:
  cache-classes: false
