server:
  port: 6565

spring:
  application:
    name: helloai
  datasource:
    url: jdbc:postgresql://localhost:15432/helloai?currentSchema=public&reWriteBatchedInserts=true
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 26379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
  rabbitmq:
    host: localhost
    port: 25672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 容忍历史迁移脚本不在 classpath（V2-V10 在历史会话中已应用但脚本文件未保留）
    validate-on-migrate: false
    ignore-missing-migrations: true

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
  # 自定义 XML mapper 路径（覆盖 BaseMapper.insert 默认行为，例如 JSONB 列）
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

moss:
  thread:
    pool:
      core-size: 8
      max-size: 64
      queue-capacity: 1000
      keep-alive-seconds: 60


# === Agent 自注册配置 ===
helloai:
  agent:
    registration-token: "helloai-reg-2024"
    allow-registration: true


score:
  time-weight: 0.25
  quality-weight: 0.30
  coop-weight: 0.25
  stability-weight: 0.15
  efficiency-weight: 0.05

logging:
  level:
    com.helloai: INFO
    com.helloai.core: DEBUG
    com.helloai.job: INFO
