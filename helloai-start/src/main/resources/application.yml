server:
  port: 6565

spring:
  application:
    name: helloai
  # 排除 DeepSeekChatAutoConfiguration：spring.ai.deepseek.api-key 已置空（平台级 Key
  # 改由 credential_vault PLATFORM 级凭证供给，见 helloai.providers.*），保留该 autoconfig
  # 会在启动期 fail-fast（Assert: DeepSeek API key must be set）。Agent 执行链路已 100%
  # 走 DeepSeekProviderChatClientFactory（程序化构建 DeepSeekApi，自带 apiKey），
  # 该 autoconfig 仅剩 ChatClient.Builder 兜底（ObjectProvider.getIfAvailable，缺失不阻断启动）
  autoconfigure:
    exclude: org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  # === 默认激活 local 环境（本地 Docker），切换到 dev 使用 spring.profiles.active=dev ===
  profiles:
    active: dev
  # === MCP Server（v2.4 §3.1 / §9 spring-ai 路线 C） ===
  # spring-ai 1.0 GA 默认 sse-endpoint=/sse（短路径），与 v2.4 文档约定的 /mcp/sse 路径不一致
  # 显式覆盖到 v2.4 路径，确保 Qoder/Trae 按文档配置可直连
  ai:
    mcp:
      server:
        name: helloai-mcp-server
        version: 1.0.0
        sse-endpoint: /mcp/sse         # v2.4 §9.3 验收：对齐文档路径
        sse-message-endpoint: /mcp/messages  # 标准 message endpoint（v2.4 协议约定）
    deepseek:
      # 该链路仅剩 chatClientBuilderProvider 兜底，Agent 执行已不走它；平台级 Key 在系统设置页配置
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        completions-path: ${DEEPSEEK_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
  datasource:
    url: jdbc:postgresql://localhost:15432/helloai?currentSchema=public&reWriteBatchedInserts=true
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 26379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
  rabbitmq:
    host: localhost
    port: 25672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
        # v1.2 §阶段3（MQ 容量治理）：prefetch 全局生效于 3 个 MANUAL ACK 消费者
        # （MqReviewCommandConsumer / MqExecutionCommandConsumer / NotificationConsumer），
        # 收紧后消息按各副本实际消费速率被拉走，避免 250 默认值导致的慢消费者囤积、快消费者饿死
        prefetch: 10
  # 产物代理上传（POST /api/artifacts/upload）multipart 上限：
  # 略高于 storage.max-file-size(5MB)，留出 multipart 边界余量
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 容忍历史迁移脚本不在 classpath（V2-V10 在历史会话中已应用但脚本文件未保留）
    validate-on-migrate: false

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
  # 自定义 XML mapper 路径（覆盖 BaseMapper.insert 默认行为，例如 JSONB 列）
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


# === Agent 自注册配置 ===
helloai:
  agent:
    registration-token: "helloai-reg-2024"
    allow-registration: true
    # E1 动态 TTL 自适应（N12 A2 第 2 段）：租约 TTL 不再静态固定
    # checkIn 未显式传 TTL 时按 Agent 表现动态推断（低分短窗口快速回收、高分长窗口减少续约）；
    # 续约路径按"是否有在跑子任务"拉长/缩短窗口（任务在跑延长、空闲缩短）。
    duty-lease:
      adaptive-ttl-enabled: true
      min-ttl-minutes: 5
      max-ttl-minutes: 240
      default-ttl-minutes: 30
      full-score: 100
  # 对话并发优化 A 项：active() 写节流窗口（毫秒，<=0 不节流）。
  # 每轮对话 LLM 前都会 active()，窗口内同一 Agent 只做一次完整双写，消除 DB 行锁排队与写放大。
  heartbeat:
    active-throttle-ms: 30000
  # 拆解异步化改造：任务拆解专用线程池（plannerDecomposeExecutor）参数外置。
  # decompose 提交即返回，LLM 拆解段异步执行；队列满按 AbortPolicy 拒绝并提示稍后重试。
  planner:
    decompose:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 20
      # PLANNING 超时回收阈值（分钟）：PlanningTimeoutTask 按 update_time 扫描卡死任务回退 PENDING。
      # 最坏拆解耗时约 4 分钟（排队 60s + 连接 5s + 读取 180s），默认 10 分钟余量充足。
      planning-timeout-minutes: 10
    # Planner Chat 输入优化（PromptEnhancer）：把用户当前输入改写为更清晰的结构化表达，
    # 独立辅助链路，不经过会话/任务执行编排（CODE_STYLE V2 §32）。
    prompt-enhance:
      enabled: true
      # 采样温度：保持语义 + 结构化改写而非创作，取低值保证稳定（建议 0.1~0.3）。
      temperature: 0.2
  # Phase 2B 调度策略 3：外部优先 / 空闲优先 / 平台内 LLM 保底
  dispatch:
    auto-assign-on-create: false
    prefer-external: false
    require-idle: true
    # E2：并发额度强制开关——有值班租约/显式声明 maxConcurrentTasks 的 Agent
    # 满额时选人链跳过、落库前拒派（false 关闭即 E2 前行为）
    enforce-max-concurrent: true
    # V24：子任务重分配最大尝试次数（熔断阈值）
    # 所有类型的重分配（离线重派、超时回收、N11回退、阻塞重试、定时兜底自动选人）
    # 每尝试一次累加 sub_task.reassign_attempt_count；达到阈值后转入 DEAD_LETTER 死信池
    # 待人工兜底（V25，原为 CANCELLED），打破"Agent全掉线→无限重分配"的死循环。
    # 设为 0 禁用熔断（不推荐生产使用）。
    max-reassign-attempts: 5
    # V25：ASSIGNED 超时未 claim 回收阈值（分钟），原为硬编码 10 分钟
    # 联调时可缩短以加快"未接单→回收→改派"的观察周期
    assigned-timeout-minutes: 10
    # §6.52：N11 外部回退时跳过"执行密集"任务自动降级（默认 true）
    # 执行密集任务（需本机 shell/文件/服务操作）不自动回退给无本机能力的 API_KEY_LLM，
    # 停留原状态并标记人工介入，避免"无能力执行→交付物不达标→返工循环→卡死审核"。
    fallback-skip-execution-dense: true
    # Phase 2C N11：外部 Agent 连续失败阈值后自动回退到平台内 API_KEY_LLM
    fallback:
      enabled: true
      failure-threshold: 3
      cooldown-minutes: 10
      scan-interval-ms: 60000
  execution:
    enabled: true
    mock-mode: false
    require-vault: true
    provider: deepseek
    model: deepseek-chat
    mock-response-prefix: "[mock-executor]"
    sync-timeout-seconds: 180
    # 对话并发优化 B 项：平台内 LLM 调用并发上限（信号量，<=0 不限流）。
    # 真实 Provider 共用同一批 API Key，上游有 RPS 限流，超限排队等待、超时友好报错。
    max-concurrent-llm-calls: 8
    llm-acquire-timeout-seconds: 60
    # Phase 2A §5.1/§5.2 + T5 改造：DB Poller 兜底扫描（主消费路径由 consumer-mode 决定）
    poller-enabled: true
    poller-interval-ms: 1000
    poller-orphan-threshold-seconds: 60
    poller-batch-size: 20
    # V41：PENDING 无 execution_record 孤儿巡检阈值 30min → 5min。
    # 覆盖"依赖解锁瞬间无空闲候选导致自动分发失败"的窗口（此前 30min 无人兜底）；
    # 循环内 isReady 守卫保证依赖未就绪的合法 PENDING 不被误伤。
    pending-orphan-threshold-minutes: 5
    pending-orphan-scan-interval-ms: 60000
    pending-orphan-batch-size: 50
    # T5 起重塑语义：consumer-mode 仅描述"主消费路径由谁承担"，Poller 自身已统一降级为孤儿兜底；
    # 三种模式都对应 Poller 仅扫孤儿 PENDING（listOrphanPending），不再调用 listAllPending。
    # 主消费路径：
    #   EVENT: 本地事务事件 (@Async + @TransactionalEventListener → LocalExecutionCommandConsumer)
    #   POLLER: MQ Consumer (@RabbitListener → MqExecutionCommandConsumer → LocalExecutionCommandConsumer)
    #   BOTH:   本地事务事件 + MQ Consumer 并行，CAS markRunning 保证幂等
    # ⚠️ POLLER/BOTH 模式下 ExecutionDispatchValidator 会强制要求 helloai.mq.execution-command.consumer-enabled=true
    #   默认开启（见下），启动期 fail-fast，避免"主消费路径失效但 Poller 仅兜底"的部署形态
    consumer-mode: POLLER
    # Phase 2E: 生产端 / 调度侧的显式派发模式，与 consumer-mode 完全解耦
    #   NONE:  命令只落库，交给 DB Poller 兜底消费（与 consumer-mode=EVENT 配套保留）
    #   EVENT: 只发布本地 Spring 事件（旧 EVENT 路径）
    #   MQ:    只投递 RabbitMQ，前提需 mq.execution-command.producer-enabled=true，否则启动 fail-fast
    #   BOTH:  事件 + MQ 双发，用于 EVENT→MQ 灰度切换
    # ⚠️ MQ/BOTH 模式下 ExecutionDispatchValidator 会同时校验 producer-enabled + outbox.relay.enabled
    dispatch-mode: MQ
  # Phase 2D N6 / Phase 2E / T5：MQ ExecutionCommand 主链路开关
  #   producer-enabled=true 时 ExecutionCommandMqPublisher 才会注册（必须与 dispatch-mode=MQ/BOTH 同时打开）
  #   consumer-enabled=true 时 MqExecutionCommandConsumer 才会注册
  # ⚠️ T5 起：consumer-mode=POLLER/BOTH 必须开启 consumer-enabled=true（启动期 fail-fast）
  #   默认两个开关都打开，对齐"MQ 主链 + Poller 兜底"的目标形态
  mq:
    execution-command:
      producer-enabled: true
      consumer-enabled: true
      exchange: helloai.execution-command.exchange
      queue: helloai.execution-command.queue
      routing-key: execution.command.created
    # 批次 D（§6.82）：REVIEWER 自动审查 L2 MQ consumer 开关（三级容错 L2 补齐）
    #   consumer-enabled=true 时 MqReviewCommandConsumer 才会注册（默认开启，L1 事件链丢失时由
    #   Outbox 补偿投递补位；与 L1 AFTER_COMMIT / L3 孤儿扫描由核验互斥锁防双审）
    review:
      consumer-enabled: true
  # N9: 多Provider统一配置入口，替代各factory中散落的@Value
  # 平台级 API Key 可在"系统设置"页动态配置/轮换（写入 credential_vault，实时生效无需重启），
  # 此处 api-key 为空时 provider 未生效（目录不可选、注册平台内 LLM Agent 被拒）；
  # base-url / default-model 作为默认值保留（可被系统设置页覆盖）。
  # key/base-url 参考 E:\yhzx\1027\springai 的 spring.ai.* 配置。
  # 四个 provider 均有 ProviderChatClientFactory 实现：deepseek 官方SDK，
  # moonshot/dashscope 走 OpenAI 兼容接口，minimax 走 Anthropic 兼容接口
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      default-model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
      connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
      # 读超时与 AgentProviderProperties 默认值对齐（3 分钟，覆盖整合报告/推理模型长输出）
      read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:180000}
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn}
      # moonshot-v1 系列已于 2026-08-31 官方下线（404），默认值切 kimi-k3（V61 迁移同步）
      default-model: ${MOONSHOT_CHAT_MODEL:kimi-k3}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/anthropic}
      default-model: ${MINIMAX_CHAT_MODEL:MiniMax-M2.5}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      # OpenAI 兼容模式，实际端点为 {base-url}/v1/chat/completions
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      default-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
  security:
    credential:
      # 凭据加密密钥（credential_vault / 系统设置页 API Key 落库加密）：
      # 默认值为随机占位符（开源仓库不含生产密钥），生产必须用环境变量
      # HELLOAI_CREDENTIAL_AES_KEY_BASE64 注入原密钥（docker-compose.server.yml 有 .env 入口）；
      # 未注入而服务器已有历史凭据时，解密会失败（启动/读取报错，属预期保护行为）
      aes-key-base64: ${HELLOAI_CREDENTIAL_AES_KEY_BASE64:cWXZTi5+S2WtnVBc+jQeJ5VCMviW+pPGB8QZN45mKFM=}
  # 执行产出物化存储（方案2）：执行成功后把 lastExecution.output 物化为附件文件，
  # type=local 落到本地磁盘（storageUrl=local://{bucket}/{objectKey}），
  # type=minio 落到对象存储（storageUrl=minio://{bucket}/{objectKey}）；
  # objectKey 统一按 {ownerName}/{yyyy}/{MM}/{taskId}/{subTaskId}/{uuid8}-{safeName} 组织，
  # 下载由 AttachmentController 流式返回（v2.7 起 minio:// 附件平台可直读）。
  # 详见 doc/design/HelloAI_执行产出物化与结构化多文件产出方案.md
  storage:
    enabled: true
    type: minio
    local-base-dir: ./data/artifacts
    bucket: helloai-local
    # --- MinIO（type=minio 时生效；本地 docker compose 默认账号见 docker-compose.yml）---
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:29000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    minio-bucket: ${MINIO_BUCKET:helloai-artifacts}
    max-files: 10
    max-file-size: 5242880
  alert:
    # 钉钉机器人 Webhook（v2.4 §4.8）。留空则不发送
    dingtalk-webhook-url: ""
    # 飞书机器人 Webhook（v2.4 §4.8）。留空则不发送
    feishu-webhook-url: ""


logging:
  level:
    com.helloai: INFO
    com.helloai.core: DEBUG
    com.helloai.job: INFO
    # §6.110 高频轮询 Mapper SQL 日志治理：poller(1s)/outbox relay(1s)/outbox 补偿(15s)
    # 三个轮询任务每轮都打 selectList DEBUG 刷屏，调高到 INFO；业务链路 Mapper SQL 日志保留
    com.helloai.core.agent.mapper.AgentExecutionRecordMapper: INFO
    com.helloai.core.agent.mapper.AgentCommandOutboxEventMapper: INFO
    com.helloai.core.agent.mapper.AgentOutboxEventMapper: INFO

# === Resilience4j 熔断降级（v2.4 §4.5） ===
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.helloai.common.base.BizException
          - java.lang.RuntimeException
        ignore-exceptions:
          - com.helloai.common.base.AgentUnavailableException
    instances:
      agentDispatch:
        base-config: default

# === Actuator 指标暴露（v2.4 §4.8 + 监控栈阶段1：Prometheus 抓取） ===
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: helloai
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 100ms, 200ms, 400ms, 800ms, 1s, 2s, 5s

# === CGLIB 缓存策略说明（v2.4 §3.1 M4 配套） ===
# 该开关是 JVM 系统属性 cglib.cache.classes（非 Spring 配置项，yml 写了也不生效），
# 由 HelloAIApplication.main() 在 Spring 启动前 System.setProperty 默认置为 false：
#   - false：每次启动重新生成 CGLIB 代理类，多花 ~2 秒，但绝对稳定（默认）。
#   - true：启动更快，但 spring-boot 进程异常退出（kill -9 / OOM / 断电）后
#     偶发 "Unable to load cache item"，需先清 %TEMP%\cglib* 目录。
# 切换方法：
#   - 命令行：java -Dcglib.cache.classes=true -jar helloai-start.jar
#   - Docker ENV：JAVA_TOOL_OPTIONS=-Dcglib.cache.classes=true
#   - IDEA Run Configuration VM options：-Dcglib.cache.classes=true（仅开发期）
# 详细参见项目 memory "Spring Boot CGLIB 缓存污染诊断与修复"。
