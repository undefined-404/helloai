# ============================================================
# HelloAI - Docker Compose 开发环境
# 技术栈: PostgreSQL 16 + Redis 7 + RabbitMQ 3.12 + MinIO
# 使用: docker-compose up -d
# ============================================================

version: '3.8'

services:

  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: helloai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helloai
      POSTGRES_USER: helloai
      POSTGRES_PASSWORD: helloai_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helloai"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: helloai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RabbitMQ 3.12 (含管理插件) ---
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: helloai-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理后台
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # --- MinIO 对象存储 ---
  minio:
    image: minio/minio:RELEASE.2024-01-13T22-36-32Z
    container_name: helloai-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data: