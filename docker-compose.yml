# ============================================================
# HelloAI - Docker Compose 开发环境
# 技术栈: PostgreSQL 16.4 + Redis 7.2.5 + RabbitMQ 3.12.14 + MinIO latest
# 使用: docker-compose up -d
# ============================================================

version: '3.8'

services:

  # --- PostgreSQL 16.4 ---
  postgres:
    image: postgres:16.4-alpine
    container_name: helloai-postgres
    restart: unless-stopped
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: helloai
      POSTGRES_USER: helloai
      POSTGRES_PASSWORD: helloai_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helloai"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Redis 7.2.5 ---
  redis:
    image: redis:7.2.5-alpine
    container_name: helloai-redis
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RabbitMQ 3.12.14 (含管理插件) ---
  rabbitmq:
    image: rabbitmq:3.12.14-management-alpine
    container_name: helloai-rabbitmq
    restart: unless-stopped
    ports:
      - "25672:5672"    # AMQP
      - "25673:15672"   # 管理后台
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # --- MinIO 对象存储 ---
  minio:
    image: minio/minio:latest
    container_name: helloai-minio
    restart: unless-stopped
    ports:
      - "29000:9000"   # S3 API
      - "29001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
